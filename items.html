<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>items table</title>
    <style>
        table{
            width:95%;
            margin:20px auto;
            border-collapse:seprate;
            border-spacing:12px;
            font-family:Arial, Helvetica, sans-serif;

        }
        th,td{
            color:blue;
            border:2px solid black;
            padding:10px;
            text-align:center;
            font-size:28px;
        }
        th{
            font-weight:bold;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Items</th>

            <th>Quantity</th>
            <th>Total cast</th>
        </tr>

        </tr>
        <tr>
            <td>Scanners</td>

            <td>500000</td>
        </tr>
        <tr>
            <td>Servers</td>
            <td>1,00,000</td>
            <td>10</td>
            <td>10,00,000</td>
        </tr>
        <tr>
            <td>printers</td>
            <td>20000</td>
            <td>10</td>
            <td>2,00,000</td>
        </tr>
        <tr>
            <td>Win softs</td>

</body>
</html>
